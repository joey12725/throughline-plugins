[project]
name = "throughline-browser-history"
version = "0.1.0"
description = "Throughline plugin: Chrome, Chromium, Brave, Edge, Vivaldi, Firefox and Safari browsing history and bookmarks"
requires-python = ">=3.12"
license = "GPL-3.0-or-later"
dependencies = ["throughline-sdk"]
[project.scripts]
throughline-browser-history = "throughline_browser_history:main"
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/throughline_browser_history"]
