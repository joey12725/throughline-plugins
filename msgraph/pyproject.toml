[project]
name = "throughline-msgraph"
version = "0.1.0"
description = "Throughline source: Microsoft 365 / Outlook.com mail and calendar through Microsoft Graph delta queries"
requires-python = ">=3.12"
license = "GPL-3.0-or-later"
dependencies = ["throughline-sdk", "httpx"]
[project.scripts]
throughline-msgraph = "throughline_msgraph:main"
throughline-msgraph-login = "throughline_msgraph.login:main"
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/throughline_msgraph"]
