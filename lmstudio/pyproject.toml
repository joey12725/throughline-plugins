[project]
name = "throughline-lmstudio"
version = "0.1.0"
description = "Throughline plugin: LM Studio conversations from its local conversation JSON files"
requires-python = ">=3.12"
license = "GPL-3.0-or-later"
dependencies = ["throughline-sdk"]
[project.scripts]
throughline-lmstudio = "throughline_lmstudio:main"
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/throughline_lmstudio"]
