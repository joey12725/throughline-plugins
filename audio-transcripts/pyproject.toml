[project]
name = "throughline-audio-transcripts"
version = "0.1.0"
requires-python = ">=3.12"
license = "GPL-3.0-or-later"
dependencies = ["throughline-sdk", "httpx"]
[project.scripts]
throughline-audio-transcripts = "throughline_audio_transcripts:main"
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/throughline_audio_transcripts"]
