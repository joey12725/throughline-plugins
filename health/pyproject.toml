[project]
name = "throughline-health"
version = "0.1.0"
description = "Throughline health source: Oura v2 and the Weight Gurus scale"
requires-python = ">=3.12"
license = "GPL-3.0-or-later"
dependencies = ["throughline-sdk"]
[project.scripts]
throughline-health = "throughline_health:main"
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/throughline_health"]
