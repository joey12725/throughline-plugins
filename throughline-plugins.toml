# ---------------------------------------------------------------- meetings

[[plugins]]
id = "wave"
path = "wave"
name = "Wave"
summary = "Meeting recordings and transcripts from Wave."
description = "Text only: transcripts, speakers and summaries; no audio or voiceprints are fetched. The `api` mode reads the official Wave API; the `archive` mode imports transcripts you already hold from a Postgres database laid out as the plugin's published archive-schema.sql (useful when migrating)."
category = "meetings"
icon = "audio-lines"
homepage = "https://wave.co"
channels = ["transcripts.wave", "recordings.wave"]
