[project]
name = "throughline-instagram-feed"
version = "0.1.0"
description = "Throughline plugin: new posts of followed public Instagram accounts"
requires-python = ">=3.12"
license = "GPL-3.0-or-later"
dependencies = ["throughline-sdk"]
[project.scripts]
throughline-instagram-feed = "throughline_instagram_feed:main"
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/throughline_instagram_feed"]
