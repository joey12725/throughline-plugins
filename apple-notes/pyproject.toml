[project]
name = "throughline-apple-notes"
version = "0.1.0"
description = "Throughline plugin: macOS Apple Notes as versioned pages (read-only NoteStore.sqlite reader)"
requires-python = ">=3.12"
license = "GPL-3.0-or-later"
dependencies = ["throughline-sdk"]
[project.scripts]
throughline-apple-notes = "throughline_apple_notes:main"
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/throughline_apple_notes"]
