[project]
name = "throughline-imessage"
version = "0.1.0"
description = "Throughline plugin: iMessage and SMS from the macOS Messages database (chat.db)"
requires-python = ">=3.12"
license = "GPL-3.0-or-later"
dependencies = ["throughline-sdk"]
[project.scripts]
throughline-imessage = "throughline_imessage:main"
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/throughline_imessage"]
