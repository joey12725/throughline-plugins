[project]
name = "throughline-android-sms"
version = "0.1.0"
description = "Throughline plugin: Android SMS, MMS and call logs from SMS Backup & Restore XML backups"
requires-python = ">=3.12"
license = "GPL-3.0-or-later"
dependencies = ["throughline-sdk"]
[project.scripts]
throughline-android-sms = "throughline_android_sms:main"
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/throughline_android_sms"]
