[project]
name = "throughline-simplefin"
version = "0.1.0"
requires-python = ">=3.12"
license = "GPL-3.0-or-later"
dependencies = ["throughline-sdk", "httpx"]
[project.scripts]
throughline-simplefin = "throughline_simplefin:main"
throughline-simplefin-claim = "throughline_simplefin.claim:main"
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/throughline_simplefin"]
