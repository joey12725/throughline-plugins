[project]
name = "throughline-imap"
version = "0.1.0"
description = "Throughline source: any IMAP mailbox over TLS (standard library imaplib + email)"
requires-python = ">=3.12"
license = "GPL-3.0-or-later"
dependencies = ["throughline-sdk"]
[project.scripts]
throughline-imap = "throughline_imap:main"
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/throughline_imap"]
