[project]
name = "throughline-email"
version = "0.1.0"
description = "Throughline email source: Gmail through Composio (stdlib fetcher plus SDK mapping)"
requires-python = ">=3.12"
license = "GPL-3.0-or-later"
dependencies = ["throughline-sdk"]
[project.scripts]
throughline-email = "throughline_email:main"
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
