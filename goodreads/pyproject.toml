[project]
name = "throughline-goodreads"
version = "0.1.0"
description = "Throughline source plugin: goodreads"
requires-python = ">=3.12"
license = "GPL-3.0-or-later"
dependencies = ["throughline-sdk", "httpx"]
[project.scripts]
throughline-goodreads = "throughline_goodreads:main"
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/throughline_goodreads"]
