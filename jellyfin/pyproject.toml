[project]
name = "throughline-jellyfin"
version = "0.1.0"
description = "Throughline source plugin: jellyfin"
requires-python = ">=3.12"
license = "GPL-3.0-or-later"
dependencies = ["throughline-sdk", "httpx"]
[project.scripts]
throughline-jellyfin = "throughline_jellyfin:main"
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/throughline_jellyfin"]
