[project]
name = "throughline-aider"
version = "0.1.0"
description = "Throughline plugin: aider chat sessions from .aider.chat.history.md files"
requires-python = ">=3.12"
license = "GPL-3.0-or-later"
dependencies = ["throughline-sdk"]
[project.scripts]
throughline-aider = "throughline_aider:main"
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/throughline_aider"]
