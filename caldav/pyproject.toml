[project]
name = "throughline-caldav"
version = "0.1.0"
description = "Throughline source: CalDAV calendars and ICS subscription URLs"
requires-python = ">=3.12"
license = "GPL-3.0-or-later"
dependencies = ["throughline-sdk", "httpx", "icalendar>=6", "recurring-ical-events>=3"]
[project.scripts]
throughline-caldav = "throughline_caldav:main"
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/throughline_caldav"]
