[project]
name = "throughline-claude-code"
version = "0.1.0"
description = "Throughline plugin: Claude Code conversations (prompts, replies, tool-call metadata) from local transcripts"
requires-python = ">=3.12"
license = "GPL-3.0-or-later"
dependencies = ["throughline-sdk"]
[project.scripts]
throughline-claude-code = "throughline_claude_code:main"
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/throughline_claude_code"]
