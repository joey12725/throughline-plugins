[project]
name = "throughline-wave"
version = "0.1.0"
requires-python = ">=3.12"
license = "GPL-3.0-or-later"
dependencies = ["throughline-sdk", "psycopg[binary]>=3.2", "httpx>=0.27"]
[project.scripts]
throughline-wave = "throughline_wave:main"
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
