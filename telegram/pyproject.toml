[project]
name = "throughline-telegram"
version = "0.1.0"
description = "Throughline plugin: Telegram chats via the MTProto user API (Telethon)"
requires-python = ">=3.12"
license = "GPL-3.0-or-later"
dependencies = ["throughline-sdk", "telethon>=1.36,<2"]
[project.scripts]
throughline-telegram = "throughline_telegram:main"
throughline-telegram-login = "throughline_telegram:login"
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/throughline_telegram"]
