[project]
name = "throughline-t3code"
version = "0.1.0"
description = "Throughline plugin: T3 Code projects, threads and messages from every environment, plus AI subscription usage, resets and reset credits"
requires-python = ">=3.12"
license = "GPL-3.0-or-later"
dependencies = ["throughline-sdk"]
[project.scripts]
throughline-t3code = "throughline_t3code:main"
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/throughline_t3code"]
