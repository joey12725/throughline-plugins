[project]
name = "throughline-calendar"
version = "0.1.0"
description = "Throughline plugin: Google Calendar occurrences and event lifecycle through Composio"
requires-python = ">=3.12"
license = "GPL-3.0-or-later"
dependencies = ["throughline-sdk"]
[project.scripts]
throughline-calendar = "throughline_calendar:main"
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
