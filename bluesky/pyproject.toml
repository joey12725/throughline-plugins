[project]
name = "throughline-bluesky"
version = "0.1.0"
requires-python = ">=3.12"
license = "GPL-3.0-or-later"
dependencies = ["throughline-sdk", "httpx"]
[project.scripts]
throughline-bluesky = "throughline_bluesky:main"
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/throughline_bluesky"]
