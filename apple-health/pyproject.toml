[project]
name = "throughline-apple-health"
version = "0.1.0"
description = "Live Apple Health data via the Health Auto Export app's REST API automation"
requires-python = ">=3.12"
license = "GPL-3.0-or-later"
dependencies = ["throughline-sdk"]
[project.scripts]
throughline-apple-health = "throughline_apple_health:main"
throughline-apple-health-receiver = "throughline_apple_health.receiver:main"
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/throughline_apple_health"]
