[project]
name = "throughline-granola"
version = "0.1.0"
description = "Throughline plugin: Granola meetings, transcripts, your typed notes and Granola's AI summaries"
requires-python = ">=3.12"
license = "GPL-3.0-or-later"
dependencies = ["throughline-sdk", "httpx>=0.27"]
[project.scripts]
throughline-granola = "throughline_granola:main"
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/throughline_granola"]
