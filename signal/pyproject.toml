[project]
name = "throughline-signal"
version = "0.1.0"
description = "Throughline plugin: Signal messages via a linked signal-cli device"
requires-python = ">=3.12"
license = "GPL-3.0-or-later"
dependencies = ["throughline-sdk"]
[project.scripts]
throughline-signal = "throughline_signal:main"
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/throughline_signal"]
