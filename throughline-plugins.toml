schema = 1
name = "Throughline starter plugins"
description = "Connectors for messages, email, calendars, meetings, location, health, media, notes, AI assistants and more, maintained with Throughline."

# Each entry follows docs/plugin-onboarding-contract.md. `setup.fields` lists
# only what a typical owner fills in; every other Manifest setting stays
# available under Advanced once the plugin is installed.
#
# `channel_roles` gives each channel's role (chat, email, calendar, telemetry,
# transcript, voice_summary, location, media, notes, other) so the core can
# treat channels by what they hold instead of by name. Track sources
# (`track_sources`) are always `location`. plugins/catalog.json is generated
# from this file by plugins/build_catalog.py; edit this file, then run it.

# ---------------------------------------------------------------- messages

[[plugins]]
id = "beeper"
path = "beeper"
name = "Beeper"
summary = "Chats from the networks you connect in Beeper (Discord, Instagram, SMS and more)."
description = "Imports chat history through the Beeper Desktop API on your computer, one thread per conversation. An `archive` mode imports chat history you already hold from a Postgres database laid out as the plugin's published archive-schema.sql (useful when migrating). Attachment, Instagram and YouTube enrichment are off by default."
category = "messages"
icon = "messages-square"
homepage = "https://www.beeper.com"
channels = ["chat.*"]               # chat.<network> for every network Beeper bridges
channel_roles = { "chat.*" = "chat" }
requires = ["companion"]
check = false
starter = true

[plugins.install]
kind = "python"
entry = "throughline-beeper"

[plugins.schedule]
interval_s = 300
mode = "poll"

[plugins.backfill]
supported = true
history = "full"
note = "Imports the history Beeper Desktop has loaded for each chat; some networks cap how far back Desktop can list."

[[plugins.setup.steps]]
title = "Turn on the Beeper Desktop API"
body = "Run Beeper Desktop on this computer, enable its local API in the app's settings and create an access token."

[[plugins.setup.fields]]
key = "BEEPER_SOURCE"
label = "Source"
kind = "select"
options = ["live", "archive"]
default = "live"
required = true
help = "live reads Beeper Desktop; archive reads a Postgres database laid out as the plugin's archive-schema.sql."

[[plugins.setup.fields]]
key = "BEEPER_ACCESS_TOKEN"
label = "Desktop API token"
kind = "secret"
required = true
when = { BEEPER_SOURCE = ["live"] }

[[plugins.setup.fields]]
key = "BEEPER_BASE_URL"
label = "Desktop API address"
kind = "url"
default = "http://localhost:23373"
advanced = true
when = { BEEPER_SOURCE = ["live"] }

[[plugins.setup.fields]]
key = "BEEPER_ARCHIVE_DSN"
label = "Archive database (Postgres DSN)"
kind = "secret"
required = true
help = "Use a read-only role."
placeholder = "postgresql://reader:…@host/db"
when = { BEEPER_SOURCE = ["archive"] }

[[plugins]]
id = "signal"
path = "signal"
name = "Signal"
summary = "Your Signal messages, received through signal-cli as a linked device."
description = "Runs [signal-cli](https://github.com/AsamK/signal-cli) as a linked device of your phone. A linked device only receives messages **from the moment it is linked**, so earlier history cannot be imported. Messages you send from your phone are imported as yours."
category = "messages"
icon = "message-circle-more"
homepage = "https://signal.org"
channels = ["signal.messages"]
channel_roles = { "signal.messages" = "chat" }
check = false
starter = true

[plugins.install]
kind = "python"
entry = "throughline-signal"

[plugins.schedule]
interval_s = 300
mode = "poll"

[plugins.backfill]
supported = false
history = "none"
note = "Signal gives linked devices no earlier history; messages arrive from the moment signal-cli is linked."

[[plugins.setup.steps]]
title = "Install and link signal-cli"
body = "Install signal-cli, run `signal-cli link -n Throughline`, and scan the QR code in Signal → Settings → Linked devices."
url = "https://github.com/AsamK/signal-cli"

[[plugins.setup.steps]]
title = "Run the daemon"
body = "Start `signal-cli -a <your number> daemon --http 127.0.0.1:8080 --receive-mode=manual` as a service, listening on localhost only."

[[plugins.setup.fields]]
key = "SIGNAL_RPC_URL"
label = "signal-cli daemon address"
kind = "url"
required = true
default = "http://127.0.0.1:8080"

[[plugins.setup.fields]]
key = "SIGNAL_ACCOUNT"
label = "Your Signal number"
help = "In +E.164 form; needed when the daemon serves several accounts."
placeholder = "+15555550100"

[[plugins.setup.fields]]
key = "SIGNAL_RPC_TOKEN"
label = "Proxy bearer token"
kind = "secret"
help = "Only when the daemon sits behind an authenticating reverse proxy."
advanced = true

[[plugins]]
id = "telegram"
path = "telegram"
name = "Telegram"
summary = "Your Telegram private chats and small groups, with full history."
description = "Logs in as you through Telegram's user API (Telethon), so it sees the same history as your apps. Broadcast channels, bots and groups larger than 50 members are skipped by default. The session string is a full login to your account: it is stored only as a secret."
category = "messages"
icon = "send"
homepage = "https://telegram.org"
channels = ["telegram.messages"]
channel_roles = { "telegram.messages" = "chat" }
check = false
starter = true

[plugins.install]
kind = "python"
entry = "throughline-telegram"

[plugins.schedule]
interval_s = 900
mode = "poll"

[plugins.backfill]
supported = true
history = "full"
note = "Walks every included chat's full history, oldest first."

[[plugins.setup.steps]]
title = "Create a Telegram app"
body = "Open API development tools and create an application; note its api_id and api_hash."
url = "https://my.telegram.org"

[[plugins.setup.steps]]
title = "Log in once"
body = "Run `throughline-telegram-login` with the api_id and api_hash set. It asks for your phone number, the login code and your 2FA password, then prints a session string."

[[plugins.setup.fields]]
key = "TELEGRAM_API_ID"
label = "api_id"
required = true
kind = "number"

[[plugins.setup.fields]]
key = "TELEGRAM_API_HASH"
label = "api_hash"
kind = "secret"
required = true

[[plugins.setup.fields]]
key = "TELEGRAM_SESSION"
label = "Session string"
kind = "secret"
required = true
help = "Printed by throughline-telegram-login. Revoke it under Settings → Devices if it leaks."

[[plugins]]
id = "imessage"
path = "imessage"
name = "iMessage"
summary = "iMessage, SMS and RCS conversations from the Messages app on your Mac."
description = "Reads `~/Library/Messages/chat.db` read-only, including messages your iPhone syncs through Messages in iCloud. Tapbacks, edits and unsends become new versions of the message. Needs Full Disk Access for the companion app."
category = "messages"
icon = "message-circle"
channels = ["imessage.messages"]
channel_roles = { "imessage.messages" = "chat" }
platforms = ["macos"]
requires = ["companion"]
check = false
starter = true

[plugins.install]
kind = "python"
entry = "throughline-imessage"

[plugins.schedule]
interval_s = 300
mode = "poll"

[plugins.backfill]
supported = true
history = "full"
note = "Imports everything still in the Messages database on this Mac."

[[plugins.setup.steps]]
title = "Allow Full Disk Access"
body = "In System Settings → Privacy & Security → Full Disk Access, allow the Throughline companion so it can read the Messages database."

[[plugins.setup.fields]]
key = "IMESSAGE_OWNER_HANDLE"
label = "Your phone number or Apple ID email"
help = "Used as the author of your own messages when the database does not record it."

[[plugins.setup.fields]]
key = "IMESSAGE_DB"
label = "Messages database"
kind = "path"
default = "~/Library/Messages/chat.db"
advanced = true

[[plugins]]
id = "android_sms"
path = "android-sms"
name = "Android SMS"
summary = "SMS, MMS and call log from an Android phone's scheduled backups."
description = "Android has no API for reading messages from another machine, so this reads the XML files the free **SMS Backup & Restore** app writes on a schedule. Point its backups at a folder synced to the Throughline machine and every new backup is picked up. Media attachments are never stored."
category = "messages"
icon = "smartphone"
channels = ["android_sms.messages", "android_sms.calls"]
channel_roles = { "android_sms.messages" = "chat", "android_sms.calls" = "other" }
requires = ["upload"]
check = false
starter = false

[plugins.install]
kind = "python"
entry = "throughline-android-sms"

[plugins.schedule]
interval_s = 3600
mode = "poll"

[plugins.backfill]
supported = true
history = "full"
note = "Imports every message and call in the backups, however old."

[[plugins.setup.steps]]
title = "Install SMS Backup & Restore"
body = "Install the app on your phone and schedule a daily backup of messages and calls."

[[plugins.setup.steps]]
title = "Sync the backup folder"
body = "Send the backups to a folder the Throughline machine can read (Syncthing, Google Drive, Dropbox, Nextcloud or a network share), or upload the sms-*.xml and calls-*.xml files."

[[plugins.setup.fields]]
key = "ANDROID_SMS_DIR"
label = "Backup folder"
kind = "directory"
required = true
help = "Holds the sms-*.xml and calls-*.xml files."

[[plugins.setup.fields]]
key = "ANDROID_SMS_OWNER_NUMBER"
label = "Your phone number"
help = "Author of the messages you sent and the calls you placed."
placeholder = "+15555550100"

[[plugins.setup.fields]]
key = "ANDROID_SMS_COUNTRY_CODE"
label = "Country calling code"
help = "Added to 10-digit national numbers so they match +E.164 forms."
placeholder = "1"
advanced = true

# ---------------------------------------------------------------- social

[[plugins]]
id = "bluesky"
path = "bluesky"
name = "Bluesky"
summary = "Your Bluesky posts, replies, reposts and likes."
description = "Reads your own repository on your PDS: everything you wrote, reposted and liked. Notifications (replies, mentions and quotes of you) are optional. Direct messages are not read."
category = "social"
icon = "cloud"
homepage = "https://bsky.app"
channels = ["bluesky.posts", "bluesky.reposts", "bluesky.likes", "bluesky.notifications"]
channel_roles = { "bluesky.posts" = "other", "bluesky.reposts" = "other", "bluesky.likes" = "other", "bluesky.notifications" = "other" }
check = false
starter = false

[plugins.install]
kind = "python"
entry = "throughline-bluesky"

[plugins.schedule]
interval_s = 1800
mode = "poll"

[plugins.backfill]
supported = true
history = "full"
note = "Your whole repository is on your PDS, so the first run imports everything."

[[plugins.setup.steps]]
title = "Create an app password"
body = "In Bluesky open Settings → Privacy and security → App passwords and create one. Never use your main password."

[[plugins.setup.fields]]
key = "BLUESKY_IDENTIFIER"
label = "Handle or DID"
required = true
placeholder = "alice.bsky.social"

[[plugins.setup.fields]]
key = "BLUESKY_APP_PASSWORD"
label = "App password"
kind = "secret"
required = true
placeholder = "xxxx-xxxx-xxxx-xxxx"

[[plugins.setup.fields]]
key = "BLUESKY_SERVICE"
label = "Sign-in server"
kind = "url"
default = "https://bsky.social"
help = "Change only for a self-hosted PDS."
advanced = true

[[plugins]]
id = "mastodon"
path = "mastodon"
name = "Mastodon"
summary = "Your Mastodon posts, favourites and bookmarks from any instance."
description = "Polls your instance with a personal access token: your own statuses, replies and boosts, the statuses you favourited and bookmarked, and optionally your mentions. Direct-visibility statuses get an access label."
category = "social"
icon = "megaphone"
homepage = "https://joinmastodon.org"
channels = ["mastodon.statuses", "mastodon.favourites", "mastodon.bookmarks", "mastodon.notifications"]
channel_roles = { "mastodon.statuses" = "other", "mastodon.favourites" = "other", "mastodon.bookmarks" = "other", "mastodon.notifications" = "other" }
check = false
starter = false

[plugins.install]
kind = "python"
entry = "throughline-mastodon"

[plugins.schedule]
interval_s = 900
mode = "poll"

[plugins.backfill]
supported = true
history = "full"
note = "Reads each stream back to the very beginning on the first run."

[[plugins.setup.steps]]
title = "Create an access token"
body = "On your instance open Preferences → Development → New application, grant read scopes, and copy the access token."

[[plugins.setup.fields]]
key = "MASTODON_BASE_URL"
label = "Your instance"
kind = "url"
required = true
placeholder = "https://mastodon.example"

[[plugins.setup.fields]]
key = "MASTODON_ACCESS_TOKEN"
label = "Access token"
kind = "secret"
required = true

[[plugins]]
id = "instagram_feed"
path = "instagram-feed"
name = "Instagram feed"
summary = "New posts and stories from public Instagram accounts you follow."
description = "Opt-in: follows a list of **public** accounts and records their posts (and, with a cookies file, their 24-hour stories) as text and links. No media is downloaded. Requests are rate limited and rotate through the list. Instagram has no API for this; automated reading may break Instagram's Terms of Use and can get your IP or account rate limited, so use it only if that is acceptable to you."
category = "social"
icon = "image"
channels = ["instagram.feed"]
channel_roles = { "instagram.feed" = "other" }
check = false
starter = false

[plugins.install]
kind = "python"
entry = "throughline-instagram-feed"

[plugins.schedule]
interval_s = 7200
mode = "poll"

[plugins.backfill]
supported = true
history = "window"
note = "Instagram shows only the newest 12 posts per account, so older posts are not reachable."

[[plugins.setup.fields]]
key = "INSTAGRAM_FEED_ACCOUNTS"
label = "Accounts to follow"
kind = "list"
required = true
help = "Comma-separated public handles."
placeholder = "natgeo, nasa"

[[plugins]]
id = "reddit"
path = "reddit"
name = "Reddit"
summary = "What you saved, upvoted, posted and commented on Reddit."
description = "Reads your own account's listings (saved, upvoted, submitted, comments; downvoted optional), read only. Signs in through a Reddit OAuth app, or through a signed-in headless browser profile when you have no API app. The standard-library fetch.py can run on another host and ship JSONL back."
category = "social"
icon = "message-circle"
homepage = "https://www.reddit.com"
channels = ["reddit.saved", "reddit.votes", "reddit.posts", "reddit.comments"]
channel_roles = { "reddit.saved" = "other", "reddit.votes" = "other", "reddit.posts" = "other", "reddit.comments" = "other" }
check = false
starter = false

[plugins.install]
kind = "python"
entry = "throughline-reddit"

[plugins.schedule]
interval_s = 3600
mode = "poll"

[plugins.backfill]
supported = true
history = "window"
note = "Reddit lists only about the newest 1,000 items per listing; older saves and votes are not reachable."

[[plugins.setup.steps]]
title = "Create a Reddit app (OAuth)"
body = "Signed in to the account to capture, create a script app at reddit.com/prefs/apps, then use its client id and secret with a refresh token (or your username and password). Without an app, choose the session transport."
url = "https://www.reddit.com/prefs/apps"

[[plugins.setup.fields]]
key = "REDDIT_USER_AGENT"
label = "User agent"
required = true
help = "Reddit requires a unique, descriptive one."
placeholder = "<platform>:<app id>:0.1.0 (by /u/<your name>)"

[[plugins.setup.fields]]
key = "REDDIT_TRANSPORT"
label = "Sign-in"
kind = "select"
options = ["oauth", "session"]
default = "oauth"
required = true
help = "oauth uses a Reddit app; session uses a signed-in headless Chromium profile."

[[plugins.setup.fields]]
key = "REDDIT_CLIENT_ID"
label = "App client id"
kind = "secret"
required = true
when = { REDDIT_TRANSPORT = ["oauth"] }

[[plugins.setup.fields]]
key = "REDDIT_CLIENT_SECRET"
label = "App secret"
kind = "secret"
when = { REDDIT_TRANSPORT = ["oauth"] }

[[plugins.setup.fields]]
key = "REDDIT_REFRESH_TOKEN"
label = "Refresh token"
kind = "secret"
help = "Or leave empty and give your username and password (script apps without two-factor sign-in)."
when = { REDDIT_TRANSPORT = ["oauth"] }

[[plugins.setup.fields]]
key = "REDDIT_SESSION_PROFILE"
label = "Browser profile folder"
kind = "directory"
required = true
help = "A private folder for the headless browser's sign-in."
when = { REDDIT_TRANSPORT = ["session"] }

[[plugins.setup.fields]]
key = "REDDIT_USERNAME"
label = "Reddit username"

[[plugins.setup.fields]]
key = "REDDIT_PASSWORD"
label = "Reddit password"
kind = "secret"
help = "Only for the password grant or to sign the browser profile in."

# ---------------------------------------------------------------- email

[[plugins]]
id = "imap"
path = "imap"
name = "Email (IMAP)"
summary = "Mail from any IMAP mailbox: Fastmail, iCloud, Proton Bridge, Gmail and more."
description = "Read-only over TLS: folders are opened with EXAMINE and bodies fetched with BODY.PEEK, so nothing is marked read. Uses All Mail when the server has one, otherwise INBOX."
category = "email"
icon = "inbox"
channels = ["imap.message"]
channel_roles = { "imap.message" = "email" }
check = false
starter = true

[plugins.install]
kind = "python"
entry = "throughline-imap"

[plugins.schedule]
interval_s = 900
mode = "poll"

[plugins.backfill]
supported = true
history = "full"
note = "Imports every message in the chosen folders; set a start date to skip older mail."

[[plugins.setup.steps]]
title = "Create an app password"
body = "Most providers (Fastmail, iCloud, Gmail, Yahoo) need an app-specific password for IMAP. Proton Mail needs Proton Mail Bridge running."

[[plugins.setup.fields]]
key = "IMAP_HOST"
label = "IMAP server"
required = true
placeholder = "imap.fastmail.com"

[[plugins.setup.fields]]
key = "IMAP_USERNAME"
label = "Login"
kind = "email"
required = true
placeholder = "you@example.com"

[[plugins.setup.fields]]
key = "IMAP_PASSWORD"
label = "Password or app password"
kind = "secret"
required = true

[[plugins.setup.fields]]
key = "IMAP_SINCE"
label = "Skip mail before"
help = "First run only, YYYY-MM-DD."
placeholder = "2020-01-01"
advanced = true

[[plugins]]
id = "email"
path = "email"
name = "Gmail (Composio)"
summary = "Gmail messages from one or more accounts connected in Composio."
description = "One message per email, threaded per Gmail thread. Reads through a Gmail connection you make in [Composio](https://composio.dev). Spam and trash are skipped. The first backfill keeps the newest 1,000 messages per account unless you raise the cap."
category = "email"
icon = "mail"
homepage = "https://composio.dev"
channels = ["email.message"]
channel_roles = { "email.message" = "email" }
check = false
starter = true

[plugins.install]
kind = "python"
entry = "throughline-email"

[plugins.schedule]
interval_s = 900
mode = "poll"

[plugins.backfill]
supported = true
history = "full"
note = "Capped at the newest 1,000 messages per account by default; set EMAIL_MAX_MESSAGES to 0 for everything."

[[plugins.setup.steps]]
title = "Connect Gmail in Composio"
body = "Create a Composio account, connect your Gmail account in the Gmail toolkit, and create an API key."
url = "https://composio.dev"

[[plugins.setup.fields]]
key = "COMPOSIO_API_KEY"
label = "Composio API key"
kind = "secret"
required = true

[[plugins.setup.fields]]
key = "EMAIL_ACCOUNTS"
label = "Connected account ids"
kind = "list"
help = "Composio connected account ids, comma separated."

[[plugins.setup.fields]]
key = "EMAIL_MAX_MESSAGES"
label = "Backfill cap per account"
kind = "number"
default = "1000"
help = "0 imports every message."
advanced = true

[[plugins]]
id = "msgraph"
path = "msgraph"
name = "Microsoft 365 / Outlook"
summary = "Mail and calendar from Microsoft 365 or Outlook.com through Microsoft Graph."
description = "Uses your own Entra app registration as a public client with the device-code sign-in: no client secret. Access is read-only (`Mail.Read`, `Calendars.Read`). Reads Inbox and Sent Items and a rolling calendar window."
category = "email"
icon = "mail-open"
homepage = "https://learn.microsoft.com/graph/"
channels = ["msgraph.message", "msgraph.events", "msgraph.changes"]
channel_roles = { "msgraph.message" = "email", "msgraph.events" = "calendar", "msgraph.changes" = "other" }
pairs_with = ["calendar"]
check = false
starter = false

[plugins.install]
kind = "python"
entry = "throughline-msgraph"

[plugins.schedule]
interval_s = 900
mode = "poll"

[plugins.backfill]
supported = true
history = "full"
note = "Mail goes back as far as the folders hold; calendar events cover a rolling window (30 days back, 90 ahead)."

[[plugins.setup.steps]]
title = "Register an app"
body = "In Microsoft Entra, register an application, allow public client flows, and add the delegated Mail.Read and Calendars.Read permissions. Copy its Application (client) id."
url = "https://entra.microsoft.com"

[[plugins.setup.steps]]
title = "Sign in once"
body = "Run `throughline-msgraph-login` and finish the device-code sign-in in your browser. It writes the token cache."

[[plugins.setup.fields]]
key = "MSGRAPH_CLIENT_ID"
label = "Application (client) id"
required = true

[[plugins.setup.fields]]
key = "MSGRAPH_TENANT"
label = "Account type"
kind = "select"
options = ["common", "consumers", "organizations"]
default = "common"
help = "consumers for Outlook.com, organizations for work or school, or common for both."

[[plugins.setup.fields]]
key = "MSGRAPH_TOKEN_CACHE"
label = "Token cache file"
kind = "path"
default = "~/.config/throughline/msgraph-token.json"
advanced = true

