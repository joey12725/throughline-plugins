[plugins.schedule]
interval_s = 900
mode = "poll"

[plugins.backfill]
supported = true
history = "full"
note = "Imports every torrent still present; torrents removed before setup are not recoverable."

[[plugins.setup.fields]]
key = "QBITTORRENT_URL"
label = "WebUI URL"
kind = "url"
required = true
placeholder = "http://localhost:8080"

[[plugins.setup.fields]]
key = "QBITTORRENT_USERNAME"
label = "WebUI username"
kind = "secret"
required = true

[[plugins.setup.fields]]
key = "QBITTORRENT_PASSWORD"
label = "WebUI password"
kind = "secret"
required = true

[[plugins]]
id = "research"
path = "research"
name = "Research streams"
summary = "Recurring web searches you define, with their findings and cited sources."
description = "Runs named lists of searches on a cadence through an OpenAI-compatible model with web search, and records each result and the events or items found in it. Results are model output and never count as evidence on their own. Model calls are paid and off until you enable them."
category = "other"
icon = "search"
channels = ["research.results", "research.items"]
channel_roles = { "research.results" = "other", "research.items" = "other" }
check = false
starter = false

[plugins.install]
kind = "python"
entry = "throughline-research"

[plugins.schedule]
interval_s = 3600
mode = "poll"

[plugins.backfill]
supported = false
history = "none"
note = "Results exist only from the first run onwards."

[[plugins.setup.fields]]
key = "RESEARCH_STREAMS"
label = "Stream config"
kind = "path"
required = true
help = "File or folder describing your search streams."

[[plugins.setup.fields]]
key = "RESEARCH_OPENAI_BASE_URL"
label = "Model endpoint"
kind = "url"
placeholder = "https://api.openai.com/v1"

[[plugins.setup.fields]]
key = "RESEARCH_OPENAI_MODEL"
label = "Model"

[[plugins.setup.fields]]
key = "RESEARCH_OPENAI_API_KEY"
label = "Endpoint API key"
kind = "secret"
