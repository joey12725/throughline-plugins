[project]
name = "throughline-markdown-notes"
version = "0.1.0"
description = "Throughline plugin: Markdown folders, Obsidian vaults and Logseq graphs as versioned pages"
requires-python = ">=3.12"
license = "GPL-3.0-or-later"
dependencies = ["throughline-sdk", "pyyaml>=6"]
[project.scripts]
throughline-markdown-notes = "throughline_markdown_notes:main"
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/throughline_markdown_notes"]
