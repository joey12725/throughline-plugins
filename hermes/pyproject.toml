[project]
name = "throughline-hermes"
version = "0.1.0"
description = "Throughline plugin: Hermes Agent conversations (every user, assistant and tool turn) and sessions"
requires-python = ">=3.12"
license = "GPL-3.0-or-later"
dependencies = ["throughline-sdk"]
[project.scripts]
throughline-hermes = "throughline_hermes:main"
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/throughline_hermes"]
