[project]
name = "throughline-listenbrainz"
version = "0.1.0"
description = "Throughline source plugin: listenbrainz"
requires-python = ">=3.12"
license = "GPL-3.0-or-later"
dependencies = ["throughline-sdk", "httpx"]
[project.scripts]
throughline-listenbrainz = "throughline_listenbrainz:main"
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/throughline_listenbrainz"]
