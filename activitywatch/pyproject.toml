[project]
name = "throughline-activitywatch"
version = "0.1.0"
description = "ActivityWatch desktop activity (apps, windows, web, editor, AFK) as coalesced Throughline sessions"
requires-python = ">=3.12"
license = "GPL-3.0-or-later"
dependencies = ["throughline-sdk"]
[project.scripts]
throughline-activitywatch = "throughline_activitywatch:main"
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/throughline_activitywatch"]
