[project]
name = "throughline-codex"
version = "0.1.0"
description = "Throughline plugin: OpenAI Codex conversations (prompts, replies, reasoning summaries, tool-call metadata) from local rollout files"
requires-python = ">=3.12"
license = "GPL-3.0-or-later"
dependencies = ["throughline-sdk", "zstandard>=0.22"]
[project.scripts]
throughline-codex = "throughline_codex:main"
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/throughline_codex"]
