[project]
name = "throughline-openwebui"
version = "0.1.0"
description = "Throughline plugin: Open WebUI chats (every branch) via its REST API"
requires-python = ">=3.12"
license = "GPL-3.0-or-later"
dependencies = ["throughline-sdk", "httpx"]
[project.scripts]
throughline-openwebui = "throughline_openwebui:main"
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/throughline_openwebui"]
